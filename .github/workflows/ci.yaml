name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: labs/40-containerized-node-app/app
        run: npm ci

      - name: Run tests if present
        working-directory: labs/40-containerized-node-app/app
        run: npm test --if-present

      - name: Build Docker image
        run: docker build -t quote-app -f labs/40-containerized-node-app/docker/Dockerfile  labs/40-containerized-node-app

      - name: Run container
        run: |
          docker run -d --name quote-app -p 3000:3000 quote-app
          echo "Container started. Debugging info:"
          docker ps -a
          docker logs quote-app || true
          netstat -tlnp | grep 3000 || echo "Port 3000 not listening"
          for i in $(seq 1 10); do
            echo "Health check attempt $i/10"
            if curl -fsS http://localhost:3000/health | grep -q "healthy\|ok\|alive"; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed after 10s"
          docker logs quote-app || true
          docker ps -a
          netstat -tlnp | grep 3000 || echo "Port 3000 not listening"
          exit 1


      - name: Stop container
        if: always()
        run: |
          docker rm -f quote-app || true
